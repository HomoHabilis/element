# Personal builds of Element for macOS (Apple Silicon), Linux (x64) and Windows (x64).
#
# Make a release: Actions tab > "Build and release" > Run workflow,
#   type the new tag (e.g. 1.2.0-jc1) and the source to build (tag or branch).
#   It builds all three platforms, then publishes one GitHub release with the
#   three downloads. The tag must not exist yet.
# Pushes to claude/** branches only build (no release), to test changes.
#
# Builds are unofficial and unsigned. macOS: on first launch use
# System Settings > Privacy & Security > Open Anyway.
name: Build and release

on:
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag to create (e.g. 1.2.0-jc1)'
        required: true
      ref:
        description: 'Source to build: an existing tag or branch (e.g. 1.2.0 or main)'
        required: true
        default: 'main'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write   # the default token in a fork is read-only

# A newer push to the same branch cancels the older test build.
# Manual release runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.info.outputs.sha }}
      label: ${{ steps.info.outputs.label }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 1
    - name: Resolve source and check tag
      id: info
      env:
        TAG: ${{ inputs.tag }}
      run: |
        SHA=$(git rev-parse HEAD)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        if [ -n "$TAG" ]; then
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick a new tag."
            exit 1
          fi
          LABEL="$TAG"
        else
          LABEL="test-${SHA:0:7}"
        fi
        echo "label=${LABEL//\//-}" >> "$GITHUB_OUTPUT"
        echo "Building $SHA as $LABEL"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      PKG: Element-${{ needs.prepare.outputs.label }}-${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.sha }}
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build \
          libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
          libfontconfig1-dev libfreetype6-dev libx11-dev libxcomposite-dev \
          libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
          libxrender-dev libglu1-mesa-dev mesa-common-dev

    - name: Boost headers (Linux)
      if: runner.os == 'Linux'
      id: boost-linux
      uses: MarkusJx/install-boost@v2.4.5
      with:
        boost_version: 1.83.0
        platform_version: 22.04
        toolset: gcc

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Boost headers (macOS)
      if: runner.os == 'macOS'
      id: boost-macos
      uses: MarkusJx/install-boost@v2.4.5
      with:
        boost_version: 1.83.0
        platform_version: 11
        toolset: clang

    - name: Cache Boost (Windows)
      if: runner.os == 'Windows'
      id: boost-cache-windows
      uses: actions/cache@v4
      with:
        path: C:\local\boost_1_83_0\boost
        key: boost-1.83.0-headers-windows

    - name: Boost headers (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $boost_dir = "C:\local\boost_1_83_0"
        if (-not (Test-Path "$boost_dir\boost")) {
          Invoke-WebRequest -Uri "https://archives.boost.io/release/1.83.0/source/boost_1_83_0.zip" -OutFile boost.zip
          New-Item -ItemType Directory -Force -Path C:\local | Out-Null
          Expand-Archive -Path boost.zip -DestinationPath C:\local
        }
        echo "BOOST_ROOT=$boost_dir" >> $env:GITHUB_ENV

    # Reuses compiled objects from earlier runs; unchanged files are not recompiled.
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.platform }}
        max-size: 1G

    - name: MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
          -DELEMENT_ENABLE_ASIO=ON `
          -DELEMENT_ENABLE_UPDATER=OFF `
          -DELEMENT_BUILD_PLUGINS=OFF `
          -DELEMENT_BUILD_TESTS=OFF

    - name: Configure (macOS and Linux)
      if: runner.os != 'Windows'
      env:
        BOOST_ROOT: ${{ steps.boost-linux.outputs.BOOST_ROOT || steps.boost-macos.outputs.BOOST_ROOT }}
      run: |
        EXTRA=""
        if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64"; fi
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release $EXTRA \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
          -DELEMENT_ENABLE_UPDATER=OFF \
          -DELEMENT_BUILD_PLUGINS=OFF \
          -DELEMENT_BUILD_TESTS=OFF

    - name: Build
      run: cmake --build build --config Release --target element_app

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: |
        APP=$(find build -maxdepth 4 -type d -name "Element.app" | head -1)
        test -n "$APP" || { echo "Element.app not found"; exit 1; }
        codesign --force --deep --sign - "$APP"
        codesign --verify --deep --verbose=2 "$APP"
        ditto -c -k --keepParent "$APP" "$PKG.zip"

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        BIN=$(find build -maxdepth 4 -type f -name element -perm -u+x | head -1)
        test -n "$BIN" || { echo "element binary not found"; exit 1; }
        mkdir -p "$PKG"
        cp "$BIN" "$PKG/"
        cp LICENSES/GPL-3.0-or-later.txt "$PKG/LICENSE.txt"
        tar -czf "$PKG.tar.gz" "$PKG"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path build -Recurse -Depth 4 -Filter element.exe | Select-Object -First 1
        if (-not $exe) { throw "element.exe not found" }
        New-Item -ItemType Directory -Force -Path $env:PKG | Out-Null
        Copy-Item $exe.FullName "$env:PKG\"
        Copy-Item LICENSES\GPL-3.0-or-later.txt "$env:PKG\LICENSE.txt"
        Compress-Archive -Path $env:PKG -DestinationPath "$env:PKG.zip"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PKG }}
        path: |
          ${{ env.PKG }}.zip
          ${{ env.PKG }}.tar.gz
        if-no-files-found: error
        retention-days: 30

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - run: ls -l dist
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        target_commitish: ${{ needs.prepare.outputs.sha }}
        name: Element ${{ inputs.tag }} (personal build)
        prerelease: ${{ inputs.prerelease }}
        body: |
          Unofficial, unsigned build of kushview/element from `${{ inputs.ref }}` at ${{ needs.prepare.outputs.sha }}.
          Licence: GPL-3.0-or-later. Source: this repository at that commit.

          - macOS (Apple Silicon): unzip, move Element.app to Applications, then on first launch use System Settings > Privacy & Security > Open Anyway.
          - Linux (x64): extract and run `./element` (needs ALSA/JACK, X11, curl and freetype libraries).
          - Windows (x64): unzip and run `element.exe`. SmartScreen may warn: More info > Run anyway.
        files: dist/*
        fail_on_unmatched_files: true
