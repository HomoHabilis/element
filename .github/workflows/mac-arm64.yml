# Personal Apple Silicon build of Element.
# - Runs on every push to a claude/** branch (test builds, zip kept as an artifact).
# - Run it by hand from the Actions tab: pick a tag or branch (e.g. 1.2.0 or main).
#   Tick "release" to also publish the zip as a GitHub release in this fork.
# The app is ad-hoc signed only: on first launch use
# System Settings > Privacy & Security > Open Anyway.
name: macOS arm64 build

on:
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (e.g. 1.2.0 or main)'
        required: true
        default: '1.2.0'
      release:
        description: 'Publish the zip as a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the release; the default token is read-only

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
        submodules: recursive

    - name: Version info
      id: info
      run: |
        SHA=$(git rev-parse HEAD)
        LABEL="${{ inputs.ref || github.ref_name }}"
        LABEL="${LABEL//\//-}"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "label=$LABEL" >> "$GITHUB_OUTPUT"
        echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

    - name: Tools
      run: brew install ninja

    - name: Boost headers
      id: boost
      uses: MarkusJx/install-boost@v2.4.5
      with:
        boost_version: 1.83.0
        platform_version: 11
        toolset: clang

    - name: Configure
      env:
        BOOST_ROOT: ${{ steps.boost.outputs.BOOST_ROOT }}
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DELEMENT_ENABLE_UPDATER=OFF \
          -DELEMENT_BUILD_PLUGINS=OFF \
          -DELEMENT_BUILD_TESTS=OFF

    - name: Build
      run: cmake --build build --config Release --target element_app

    - name: Ad-hoc sign and zip
      id: pkg
      run: |
        APP=$(find build -maxdepth 4 -type d -name "Element.app" | head -1)
        test -n "$APP" || { echo "Element.app not found"; exit 1; }
        codesign --force --deep --sign - "$APP"
        codesign --verify --deep --verbose=2 "$APP"
        ZIP="Element-${{ steps.info.outputs.label }}-${{ steps.info.outputs.short }}-macos-arm64.zip"
        ditto -c -k --keepParent "$APP" "$ZIP"
        echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.pkg.outputs.zip }}
        path: ${{ steps.pkg.outputs.zip }}
        retention-days: 30

    - name: Publish release
      if: github.event_name == 'workflow_dispatch' && inputs.release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: mac-${{ steps.info.outputs.label }}-${{ github.run_number }}
        target_commitish: ${{ steps.info.outputs.sha }}
        name: Element ${{ steps.info.outputs.label }} (${{ steps.info.outputs.short }}) macOS arm64, personal build
        body: |
          Unofficial ad-hoc signed build of kushview/element at ${{ steps.info.outputs.sha }}.
          GPL-3.0-or-later; source is this repository at that commit.
          First launch: System Settings > Privacy & Security > Open Anyway.
        files: ${{ steps.pkg.outputs.zip }}
